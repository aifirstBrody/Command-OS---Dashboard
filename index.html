<style>
:root{--orange:#FF671F;--deep-orange:#D6562B;--green:#ACBF37;--bg:#0c0a09;--card:#1a1714;--border:rgba(255,255,255,0.08);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{background:#0c0a09;color:#E9E9E9;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.font-display{font-family:'Barlow Condensed',sans-serif;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,103,31,0.3);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,103,31,0.5);}

.animate-pulse-dot{animation:pulse-dot 2s ease-in-out infinite;}
@keyframes fade-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-up{animation:fade-up 0.45s ease-out both;}
@keyframes spin{to{transform:rotate(360deg)}}
.animate-spin{animation:spin 1s linear infinite;}
@keyframes bounce-dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.bounce-dot{animation:bounce-dot 1.2s ease-in-out infinite;}

.command-bar{background:rgba(12,10,9,0.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.07);}
.chat-dock{background:rgba(13,11,9,0.97);backdrop-filter:blur(16px);border-left:1px solid rgba(255,255,255,0.07);}
.card{background:#1a1714;border:1px solid rgba(255,255,255,0.08);border-radius:12px;}

.nav-item:hover{background:rgba(255,103,31,0.08);color:#E9E9E9;}
.nav-item.active{background:linear-gradient(135deg,rgba(255,103,31,0.18),rgba(214,86,43,0.1));color:#FF671F;border-color:rgba(255,103,31,0.2);}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;font-weight:600;transition:all 0.15s;cursor:pointer;border:none;outline:none;}
.btn-primary{background:#FF671F;color:white;padding:7px 16px;}
.btn-primary:hover{background:#D6562B;}
.btn-outline{background:transparent;color:#FF671F;padding:7px 16px;border:1px solid rgba(255,103,31,0.4);}
.btn-outline:hover{background:rgba(255,103,31,0.1);}
.btn-ghost{background:transparent;color:#9a9491;padding:7px 8px;}
.btn-ghost:hover{background:rgba(255,255,255,0.06);color:#E9E9E9;}
.btn-icon{width:34px;height:34px;padding:0;border-radius:8px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;}
.badge-red{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
.badge-yellow{background:rgba(234,179,8,0.15);color:#fbbf24;border:1px solid rgba(234,179,8,0.3);}
.badge-green{background:rgba(172,191,55,0.15);color:#ACBF37;border:1px solid rgba(172,191,55,0.3);}
.badge-orange{background:rgba(255,103,31,0.15);color:#FF671F;border:1px solid rgba(255,103,31,0.3);}
.badge-gray{background:rgba(255,255,255,0.07);color:#9a9491;border:1px solid rgba(255,255,255,0.1);}
.alert-critical{border-left:3px solid #ef4444;}
.alert-warning{border-left:3px solid #fbbf24;}
.alert-ok{border-left:3px solid #ACBF37;}
.alert-info{border-left:3px solid #FF671F;}
.metric-val{font-family:'Barlow Condensed',sans-serif;font-size:2.4rem;font-weight:800;line-height:1;}
.progress-track{height:4px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;}
.section-q{font-family:ui-monospace,monospace;font-size:0.67rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#FF671F;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;backdrop-filter:blur(4px);}
.drawer-panel{position:fixed;right:0;top:0;height:100%;width:440px;max-width:95vw;background:#1a1714;border-left:1px solid rgba(255,255,255,0.08);z-index:101;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,0.5);}

function PulseDot({ color = 'bg-[#ACBF37]' }) {
  return html`<div class=${'w-2 h-2 rounded-full flex-shrink-0 animate-pulse-dot ' + color}></div>`;
}

function Badge({ children, variant = 'gray' }) {
  return html`<span class=${'badge badge-' + variant}>${children}</span>`;
}

function SectionHeader({ question, title, description }) {
  return html`
    <div class="mb-6">
      <div class="pl-3 border-l-2 border-[rgba(255,103,31,0.3)] mb-3">
        <p class="section-q">${question}</p>
      </div>
      <h2 class="font-display text-3xl md:text-4xl font-black text-white leading-tight animate-fade-up">${title}</h2>
      <p class="text-sm text-[#9a9491] mt-2 max-w-2xl">${description}</p>
    </div>
    <div class="h-px bg-[rgba(255,255,255,0.07)] mb-7"></div>
  `;
}

function ExecutiveCommand() {

              </span>
              <span class="text-xs text-[#6b6460]">vs last wk</span>
            </div>
          </div>
        `)}
      </div>

        <!-- Live Alerts -->

          <div class="flex items-center justify-between px-4 py-3 border-b border-[rgba(255,255,255,0.06)]">

                    <div class="text-xs text-[#9a9491] mt-0.5">${a.detail}</div>

                  <span class="text-xs text-[#6b6460] flex-shrink-0">${a.time}</span>

/* ═══════════════════════════════════════════════════════════════════
   SECTION 3: EMPLOYEE INTERVIEW
═══════════════════════════════════════════════════════════════════ */

function EmployeeInterview() {
  const [msgs, setMsgs] = useState([{
    id:'0', role:'assistant',
    content:"Hi! I'm Rocky — Peak Refuel's operations assistant. I'm here to capture what the team knows, what's working, what isn't, and what we need to fix. What's on your mind today?",
    time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
    source:'Rocky',
  }]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [dept, setDept] = useState('');
  const [urgency, setUrgency] = useState('normal');
  const [followUp, setFollowUp] = useState(false);
  const [logHistory, setLogHistory] = useState([]);
  const scrollRef = useRef(null);
  const sessionId = useRef('interview-' + Date.now());

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs, loading]);

  const send = async () => {
    if (!input.trim() || loading) return;
    const content = input.trim();
    setInput('');
    const userMsg = { id: Date.now().toString(), role:'user', content, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), dept: dept||undefined, tags:[dept,urgency!=='normal'?urgency:'',followUp?'follow-up':''].filter(Boolean) };
    setMsgs(m => [...m, userMsg]);
    setLoading(true);
    fetch('/api/intake', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...userMsg, session: sessionId.current, meta:{dept,urgency,followUp}}) }).catch(()=>{});
    fetch('/api/log/conversation', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...userMsg, session: sessionId.current}) }).catch(()=>{});
    try {
      const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:content, department:dept, urgency, followUp, person:'employee', session: sessionId.current, history: msgs.slice(-8).map(m=>({role:m.role,content:m.content})) }) });
      const data = await res.json();
      const bot = { id:(Date.now()+1).toString(), role:'assistant', content: data.reply||data.message||'(no response)', time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), source: data.source||'Rocky', tags: data.tags||[] };
      setMsgs(m => [...m, bot]);
      fetch('/api/log/conversation', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...bot, session: sessionId.current}) }).catch(()=>{});
    } catch {
      setMsgs(m => [...m, { id:(Date.now()+1).toString(), role:'assistant', content:'Backend unavailable. Start /api/chat to enable live responses.', time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), source:'error' }]);
    } finally { setLoading(false); }
  };

  const logObsidian = async (type, label, emoji) => {
    if (msgs.length <= 1) return;
    try {
      await fetch('/api/log/obsidian', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type, messages:msgs, meta:{dept,urgency,followUp}, session: sessionId.current, timestamp: new Date().toISOString() }) });
      setLogHistory(h => [{ icon:emoji, label:`${label} saved`, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }, ...h]);
    } catch {}
  };

  return html`
    <div>
      ${SectionHeader({ question:'What are employees saying?', title:'Employee Interview', description:'Rocky captures team insights, blockers, and knowledge. Every message is logged to the conversation archive and Obsidian vault.' })}
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <!-- Chat -->
        <div class="lg:col-span-2 card overflow-hidden flex flex-col" style="height:520px">
          <div class="flex items-center justify-between px-4 py-3 border-b border-[rgba(255,255,255,0.06)]">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm" style="background:rgba(255,103,31,0.12);border:1px solid rgba(255,103,31,0.22)">🤖</div>
              <div>
                <div class="text-sm font-semibold text-white">Rocky — Interview Mode</div>
                <div class="text-[10px] text-[#9a9491]">via /api/intake · never calls AI directly</div>
              </div>
            </div>
            <span class="badge badge-orange">Interview</span>
          </div>
          <div ref=${scrollRef} class="flex-1 overflow-y-auto p-4 space-y-3">
            ${msgs.map(m => html`
              <div key=${m.id} class=${'flex ' + (m.role==='user' ? 'justify-end' : 'justify-start')}>
                <div style="max-width:82%">
                  <div class=${'flex items-center gap-1.5 mb-1 ' + (m.role==='user' ? 'justify-end' : '')}>
                    <span class="text-[10px] text-[#6b6460]">${m.time}</span>
                    ${m.source && html`<span class="text-[10px] px-1.5 py-0.5 rounded-full text-[#9a9491]" style="background:rgba(255,255,255,0.05)">${m.source}</span>`}
                  </div>
                  <div class=${'px-3 py-2.5 rounded-xl text-sm leading-relaxed ' + (m.role==='user' ? 'rounded-tr-sm' : 'rounded-tl-sm')}
                    style=${{ background: m.role==='user' ? 'linear-gradient(135deg,rgba(255,103,31,0.18),rgba(214,86,43,0.1))' : 'rgba(255,255,255,0.05)', border: `1px solid ${m.role==='user'?'rgba(255,103,31,0.25)':'rgba(255,255,255,0.07)'}` }}>
                    ${m.content}
                  </div>
                  ${m.tags&&m.tags.length>0 && html`
                    <div class=${'flex flex-wrap gap-1 mt-1 ' + (m.role==='user'?'justify-end':'')}>
                      ${m.tags.map(t => html`<span key=${t} class="text-[9px] px-1.5 py-0.5 rounded-full text-[#6b6460]" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07)">${t}</span>`)}
                    </div>
                  `}
                </div>
              </div>
            `)}
            ${loading && html`
              <div class="flex justify-start">
                <div class="px-3 py-2.5 rounded-xl rounded-tl-sm" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07)">
                  <div class="flex gap-1">
                    ${[0,150,300].map(d => html`<div key=${d} class="w-1.5 h-1.5 rounded-full bg-[#FF671F] bounce-dot" style=${{animationDelay:d+'ms'}}></div>`)}
                  </div>
                </div>
              </div>
            `}
          </div>
          <!-- Tag bar -->
          <div class="px-4 py-2 border-t border-[rgba(255,255,255,0.06)]" style="background:rgba(0,0,0,0.15)">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-[10px] text-[#6b6460]">Tag:</span>
              <select value=${dept} onChange=${e => setDept(e.target.value)} class="text-[10px] px-2 py-1 rounded-md text-[#9a9491]" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1)">
                <option value="">Department…</option>
                ${DEPTS_FOR_SELECT.map(d => html`<option key=${d} value=${d}>${d}</option>`)}
              </select>
              <select value=${urgency} onChange=${e => setUrgency(e.target.value)} class="text-[10px] px-2 py-1 rounded-md text-[#9a9491]" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1)">
                <option value="normal">Normal</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
              <label class="flex items-center gap-1 text-[10px] text-[#9a9491] cursor-pointer">
                <input type="checkbox" checked=${followUp} onChange=${e => setFollowUp(e.target.checked)} style="accent-color:#FF671F;width:12px;height:12px"/>
                Follow-up
              </label>
            </div>
          </div>
          <!-- Input -->
          <div class="px-4 py-3 border-t border-[rgba(255,255,255,0.06)] flex gap-2">
            <textarea value=${input} rows="2" placeholder="Type your message… (Enter to send, Shift+Enter for new line)"
              class="flex-1 resize-none px-3 py-2 text-sm rounded-xl"
              style=${{ background:'rgba(255,255,255,0.06)', border:`1px solid ${input?'rgba(255,103,31,0.4)':'rgba(255,255,255,0.1)'}` }}
              onChange=${e => setInput(e.target.value)}
              onKeyDown=${e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }}
            />
            <button class="btn btn-primary rounded-xl px-4" disabled=${loading||!input.trim()} onClick=${send}>→</button>
          </div>
        </div>

        <!-- Session + Obsidian panel -->
        <div class="space-y-3">
          <div class="card p-4">
            <div class="font-semibold text-sm mb-3 text-white">Session Info</div>
            <div class="space-y-2 text-xs text-[#9a9491]">
              <div class="flex justify-between"><span>Messages</span><span class="text-white font-medium">${msgs.length}</span></div>
              <div class="flex justify-between"><span>Department</span><span class="text-[#FF671F] font-medium">${dept||'Untagged'}</span></div>
              <div class="flex justify-between"><span>Urgency</span><span class=${'font-medium capitalize ' + (urgency==='urgent'?'text-red-400':urgency==='high'?'text-yellow-400':'text-[#ACBF37]')}>${urgency}</span></div>
              <div class="flex justify-between"><span>Follow-up</span><span class=${followUp?'text-yellow-400':'text-[#6b6460]'}>${followUp?'Yes':'No'}</span></div>
            </div>
            <button class="mt-3 w-full text-xs py-1.5 rounded-lg text-[#9a9491] hover:text-white transition-colors" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08)" onClick=${()=>{setMsgs(m=>[m[0]]);setLogHistory([]);}}>Clear Session</button>
          </div>
          <div class="card p-4">
            <div class="font-semibold text-sm mb-3 text-white">📓 Obsidian Logging</div>
            <div class="space-y-1.5">
              ${[['raw','💾','Raw Chat'],['summary','📋','Summary'],['actions','✅','Action Items'],['sop','📐','SOP Candidates'],['skills','🧠','Skill Candidates'],['deptTags','🏷','Dept Tags']].map(([t,i,l]) => html`
                <button key=${t} class="w-full text-left text-xs px-3 py-2 rounded-lg text-[#9a9491] hover:text-white transition-all" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)" onClick=${()=>logObsidian(t,l,i)}>${i} ${l}</button>
              `)}
            </div>
          </div>
          ${logHistory.length > 0 && html`
            <div class="card p-4">
              <div class="font-semibold text-sm mb-3 text-white">Recent Logs</div>
              <div class="space-y-1.5">
                ${logHistory.slice(0,5).map((l,i) => html`
                  <div key=${i} class="flex items-center gap-1.5 text-xs">
                    <span>${l.icon}</span><span class="flex-1 text-[#9a9491] truncate">${l.label}</span><span class="text-[#6b6460]">${l.time}</span>
                  </div>
                `)}
              </div>
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 4: PAIN POINT DISCOVERY
═══════════════════════════════════════════════════════════════════ */

function PainPointDiscovery() {
  const [filter, setFilter] = useState('all');
  const [expanded, setExpanded] = useState(null);

  const sevColor = s => ({ critical:'text-red-400', high:'text-yellow-400', medium:'text-[#FF671F]', low:'text-[#9a9491]' }[s] || 'text-[#9a9491]');
  const sevBadge = s => ({ critical:'badge-red', high:'badge-yellow', medium:'badge-orange', low:'badge-gray' }[s] || 'badge-gray');
  const sevDot = s => ({ critical:'bg-red-500', high:'bg-yellow-400', medium:'bg-[#FF671F]', low:'bg-[#9a9491]' }[s] || 'bg-[#9a9491]');

  const filtered = filter === 'all' ? PAIN_POINTS : PAIN_POINTS.filter(p => p.severity === filter);

  return html`
    <div>
      ${SectionHeader({ question:'What is slowing us down?', title:'Pain Point Discovery', description:'Friction points captured from team interviews and operational data. Click any item to expand root cause and proposed fix.' })}
      <!-- Filter tabs -->
      <div class="flex gap-2 mb-6 flex-wrap">
        ${['all','critical','high','medium','low'].map(f => html`
          <button key=${f} class=${'tab ' + (filter===f?'active':'')} onClick=${()=>setFilter(f)}>
            ${f==='all'?'All Pain Points':f.charAt(0).toUpperCase()+f.slice(1)}
            ${f!=='all' && html`<span class="ml-1.5 text-[10px]">${PAIN_POINTS.filter(p=>p.severity===f).length}</span>`}
          </button>
        `)}
      </div>

      <!-- Timeline -->
      <div class="space-y-0">
        ${filtered.map((pp, i) => html`
          <div key=${pp.id} class="relative pl-8 pb-4">
            <!-- Connector line -->
            ${i < filtered.length - 1 && html`<div class="timeline-connector absolute" style="left:7px;top:24px;bottom:0;width:2px;background:rgba(255,255,255,0.07)"></div>`}
            <!-- Dot -->
            <div class=${'absolute left-0 top-1 w-4 h-4 rounded-full border-2 flex items-center justify-center ' + sevDot(pp.severity)} style="border-color:#0c0a09;box-shadow:0 0 0 2px rgba(255,255,255,0.08)"></div>

            <button class="w-full card card-hover text-left p-4" onClick=${()=>setExpanded(expanded===pp.id?null:pp.id)}>
              <div class="flex items-start justify-between gap-3">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap mb-1">
                    <span class=${'text-sm font-semibold ' + sevColor(pp.severity)}>${pp.title}</span>
                    <span class=${'badge ' + sevBadge(pp.severity)}>${pp.severity.toUpperCase()}</span>
                    <span class="badge badge-gray">${pp.dept}</span>
                  </div>
                  <p class="text-xs text-[#9a9491]">${pp.description}</p>
                </div>
                <div class="text-right flex-shrink-0">
                  <div class="text-xs text-[#6b6460]">${pp.date}</div>
                  <div class=${'text-xs mt-1 ' + (expanded===pp.id ? 'text-[#FF671F]' : 'text-[#9a9491]')}>${expanded===pp.id ? '▲ Less' : '▼ Detail'}</div>
                </div>
              </div>
              ${expanded === pp.id && html`
                <div class="mt-3 pt-3 border-t border-[rgba(255,255,255,0.06)] text-xs text-[#9a9491] leading-relaxed animate-fade-up">
                  <div class="flex items-start gap-2">
                    <span class="text-[#FF671F] mt-0.5 flex-shrink-0">›</span>
                    <span>${pp.detail}</span>
                  </div>
                </div>
              `}
            </button>
          </div>
        `)}
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 6: RECOMMENDATION ENGINE
═══════════════════════════════════════════════════════════════════ */

function RecommendationEngine() {
  const [recs, setRecs] = useState(RECOMMENDATIONS);
  const pending = recs.filter(r => r.status === 'pending');

  const handle = async (id, action) => {
    setRecs(r => r.map(rec => rec.id === id ? { ...rec, status: action === 'approve' ? 'approved' : 'dismissed' } : rec));
    fetch('/api/recommendations', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, action }) }).catch(()=>{});
  };

  const urgBadge = u => ({ Critical:'badge-red', High:'badge-yellow', Medium:'badge-orange', Low:'badge-gray' }[u] || 'badge-gray');

  return html`
    <div>
      ${SectionHeader({ question:'What does Rocky recommend?', title:'Recommendation Engine', description:"Rocky's suggested actions based on current operations data. Items requiring Chris approval are highlighted." })}
      <!-- Pending count -->
      <div class="flex items-center gap-4 mb-6 p-4 rounded-xl" style="background:rgba(255,103,31,0.06);border:1px solid rgba(255,103,31,0.18)">
        <div class="metric-val text-[#FF671F] text-5xl">${pending.length}</div>
        <div>
          <div class="font-semibold text-white">Pending Recommendations</div>
          <div class="text-sm text-[#9a9491]">${recs.filter(r=>r.needsApproval&&r.status==='pending').length} require Chris approval · ${recs.filter(r=>!r.needsApproval&&r.status==='pending').length} can proceed without approval</div>
        </div>
      </div>
      <!-- Rec cards -->
      <div class="space-y-3">
        ${recs.map(r => html`
          <div key=${r.id} class=${'card p-4 transition-all ' + (r.status==='approved' ? 'opacity-50' : r.status==='dismissed' ? 'opacity-30' : 'card-hover')}>
            <div class="flex items-start gap-4">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap mb-1.5">
                  <span class="font-semibold text-sm text-white">${r.title}</span>
                  <span class=${'badge ' + urgBadge(r.urgency)}>${r.urgency}</span>
                  <span class="badge badge-gray">${r.dept}</span>
                  ${r.needsApproval && html`<span class="badge badge-orange">⚡ Needs Chris Approval</span>`}
                  ${r.status === 'approved' && html`<span class="badge badge-green">✓ Approved</span>`}
                  ${r.status === 'dismissed' && html`<span class="badge badge-gray">Dismissed</span>`}
                </div>
                <p class="text-xs text-[#9a9491] leading-relaxed">${r.desc}</p>
              </div>
              ${r.status === 'pending' && html`
                <div class="flex flex-col gap-2 flex-shrink-0">
                  <button class="btn btn-primary text-xs px-3 py-1.5 rounded-lg" onClick=${()=>handle(r.id,'approve')}>Approve</button>
                  <button class="btn btn-ghost text-xs px-3 py-1.5 rounded-lg border border-[rgba(255,255,255,0.1)]" onClick=${()=>handle(r.id,'dismiss')}>Dismiss</button>
                </div>
              `}
            </div>
          </div>
        `)}
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 8: SYSTEM STATUS
═══════════════════════════════════════════════════════════════════ */

function SystemStatus() {
  const [statuses, setStatuses] = useState(SYSTEM_STATUS);
  const [checking, setChecking] = useState(null);

  const check = async (key) => {
    setChecking(key);
    try {
      const data = await fetch('/api/system/status').then(r => r.json());
      if (data[key]) setStatuses(s => s.map(x => x.key === key ? { ...x, ...data[key] } : x));
    } catch {}
    setTimeout(() => setChecking(null), 1200);
  };

  const statusDot = s => s === 'ok' ? 'bg-[#ACBF37]' : s === 'warn' ? 'bg-yellow-400' : 'bg-red-500';
  const statusBadge = s => s === 'ok' ? 'badge-green' : s === 'warn' ? 'badge-yellow' : 'badge-red';

  return html`
    <div>
      ${SectionHeader({ question:'Are all systems operational?', title:'System Status', description:'Backend service health. All credentials live in backend .env — no API keys, tokens, or webhooks stored in this browser.' })}
      <!-- Security notice -->
      <div class="flex items-start gap-3 p-4 rounded-xl mb-6" style="background:rgba(172,191,55,0.05);border:1px solid rgba(172,191,55,0.2)">
        <span class="text-[#ACBF37] flex-shrink-0">🔒</span>
        <div class="text-sm text-[#ACBF37]">
          <strong>Zero credentials in frontend.</strong> Acumatica endpoint, API credentials, Slack webhook, Twilio tokens, and AI API keys all live in the backend <code class="text-xs font-mono bg-[rgba(172,191,55,0.1)] px-1.5 py-0.5 rounded">.env</code> file. This browser never sees them.
        </div>
      </div>
      <!-- Status cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        ${statuses.map(s => html`
          <div key=${s.key} class="card card-hover p-4">
            <div class="flex items-start justify-between mb-3">
              <div class="flex items-center gap-2.5">
                <span class="text-2xl">${s.icon}</span>
                <div>
                  <div class="font-semibold text-sm text-white">${s.label}</div>
                  <span class=${'badge mt-0.5 ' + statusBadge(s.status)}>${s.statusLabel}</span>
                </div>
              </div>
              <div class=${'w-2.5 h-2.5 rounded-full flex-shrink-0 mt-1 animate-pulse-dot ' + statusDot(s.status)}></div>
            </div>
            <p class="text-xs text-[#9a9491] leading-relaxed mb-3">${s.detail}</p>
            <div class="flex items-center justify-between pt-2 border-t border-[rgba(255,255,255,0.06)]">
              <span class="text-[10px] text-[#6b6460]">Last checked: 2 min ago</span>
              <button class="btn btn-ghost text-[10px] px-2 py-1 rounded-lg border border-[rgba(255,255,255,0.08)]" onClick=${()=>check(s.key)}>
                <span class=${checking===s.key?'animate-spin inline-block':'inline-block'}>↻</span> Check
              </button>
            </div>
          </div>
        `)}
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   CHAT DOCK (always-visible right panel)
═══════════════════════════════════════════════════════════════════ */

function ChatDock({ onClose }) {
  const [msgs, setMsgs] = useState([{
    id:'0', role:'assistant',
    content:"Hi Chris — I'm Rocky. Ask me anything about operations, production, inventory, or the team.",
    time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
    source:'Rocky',
  }]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [dept, setDept] = useState('');
  const [urgency, setUrgency] = useState('normal');
  const [followUp, setFollowUp] = useState(false);
  const [logHistory, setLogHistory] = useState([]);
  const [showLog, setShowLog] = useState(false);
  const scrollRef = useRef(null);
  const sessionId = useRef('chat-' + Date.now());

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs, loading]);

  const send = async () => {
    if (!input.trim() || loading) return;
    const content = input.trim();
    setInput('');
    const userMsg = { id: Date.now().toString(), role:'user', content, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), dept: dept||undefined, tags:[dept,urgency!=='normal'?urgency:'',followUp?'follow-up':''].filter(Boolean) };
    setMsgs(m => [...m, userMsg]);
    setLoading(true);
    fetch('/api/log/conversation', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...userMsg, session: sessionId.current, meta:{dept,urgency,followUp}}) }).catch(()=>{});
    try {
      const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:content, department:dept, urgency, followUp, person:'chris', session: sessionId.current, history: msgs.slice(-10).map(m=>({role:m.role,content:m.content})) }) });
      const data = await res.json();
      const bot = { id:(Date.now()+1).toString(), role:'assistant', content: data.reply||data.message||'(no response from backend)', time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), source: data.source||'backend', tags: data.tags||[] };
      setMsgs(m => [...m, bot]);
      fetch('/api/log/conversation', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...bot, session: sessionId.current}) }).catch(()=>{});
    } catch {
      setMsgs(m => [...m, { id:(Date.now()+1).toString(), role:'assistant', content:'Backend unavailable. Make sure /api/chat is running.', time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), source:'error' }]);
    } finally { setLoading(false); }
  };

  const logObsidian = async (type, label, emoji) => {
    if (msgs.length <= 1) return;
    try {
      await fetch('/api/log/obsidian', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type, messages:msgs, meta:{dept,urgency,followUp}, session: sessionId.current, timestamp: new Date().toISOString() }) });
      setLogHistory(h => [{ icon:emoji, label:`${label} saved`, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }, ...h]);
    } catch {}
  };

  return html`
    <div class="chat-dock flex flex-col h-full flex-shrink-0" style="width:300px">
      <!-- Header -->
      <div class="flex items-center justify-between px-3 py-3 border-b flex-shrink-0" style="border-color:rgba(255,255,255,0.07)">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg flex items-center justify-center text-sm flex-shrink-0" style="background:rgba(255,103,31,0.12);border:1px solid rgba(255,103,31,0.22)">🤖</div>
          <div>
            <div class="text-sm font-semibold text-white">Rocky</div>
            <div class="text-[10px] text-[#9a9491]">via /api/chat</div>
          </div>
        </div>
        <div class="flex gap-1">
          <button class="btn btn-ghost btn-icon text-xs" style="color:#9a9491" onClick=${()=>setShowLog(v=>!v)} title="Obsidian logs">📓</button>
          <button class="btn btn-ghost btn-icon text-xs" style="color:#9a9491" onClick=${onClose}>✕</button>
        </div>
      </div>

      <!-- Obsidian log panel -->
      ${showLog && html`
        <div class="border-b px-3 py-2 flex-shrink-0" style="background:rgba(0,0,0,0.2);border-color:rgba(255,255,255,0.07)">
          <div class="text-[9px] font-semibold uppercase tracking-widest text-[#6b6460] mb-2">Obsidian Logging</div>
          <div class="grid grid-cols-3 gap-1 mb-1.5">
            ${[['raw','💾','Raw'],['summary','📋','Summary'],['actions','✅','Actions'],['sop','📐','SOP'],['skills','🧠','Skills'],['deptTags','🏷','Tags']].map(([t,i,l]) => html`
              <button key=${t} class="text-[9px] px-1.5 py-1.5 rounded-lg text-[#9a9491] hover:text-white transition-colors text-center" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)" onClick=${()=>logObsidian(t,l,i)}>${i} ${l}</button>
            `)}
          </div>
          ${logHistory.length > 0 && html`
            <div class="space-y-0.5 max-h-16 overflow-y-auto">
              ${logHistory.slice(0,3).map((l,i) => html`
                <div key=${i} class="flex items-center gap-1 text-[9px] text-[#6b6460]">
                  <span>${l.icon}</span><span class="flex-1 truncate">${l.label}</span><span>${l.time}</span>
                </div>
              `)}
            </div>
          `}
        </div>
      `}

      <!-- Messages -->
      <div ref=${scrollRef} class="flex-1 overflow-y-auto p-3 space-y-3">
        ${msgs.map(m => html`
          <div key=${m.id} class=${'flex ' + (m.role==='user'?'justify-end':'justify-start')}>
            <div style="max-width:90%">
              <div class=${'flex items-center gap-1 mb-1 ' + (m.role==='user'?'justify-end':'')}>
                <span class="text-[9px] text-[#6b6460]">${m.time}</span>
                ${m.source && html`<span class="text-[9px] px-1.5 py-0.5 rounded-full" style=${{background:'rgba(255,255,255,0.05)',color:m.source==='error'?'#ef4444':'#9a9491'}}>${m.source}</span>`}
              </div>
              <div class=${'px-3 py-2 rounded-xl text-xs leading-relaxed ' + (m.role==='user'?'rounded-tr-sm':'rounded-tl-sm')}
                style=${{ background: m.role==='user'?'linear-gradient(135deg,rgba(255,103,31,0.2),rgba(214,86,43,0.12))':'rgba(255,255,255,0.05)', border:`1px solid ${m.role==='user'?'rgba(255,103,31,0.28)':'rgba(255,255,255,0.07)'}` }}>
                ${m.content}
              </div>
            </div>
          </div>
        `)}
        ${loading && html`
          <div class="flex justify-start">
            <div class="px-3 py-2 rounded-xl rounded-tl-sm" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07)">
              <div class="flex gap-1">
                ${[0,150,300].map(d => html`<div key=${d} class="w-1.5 h-1.5 rounded-full bg-[#FF671F] bounce-dot" style=${{animationDelay:d+'ms'}}></div>`)}
              </div>
            </div>
          </div>
        `}
      </div>

      <!-- Tag bar -->
      <div class="px-3 py-1.5 border-t flex-shrink-0" style="background:rgba(0,0,0,0.18);border-color:rgba(255,255,255,0.07)">
        <div class="flex items-center gap-1.5">
          <select value=${dept} onChange=${e=>setDept(e.target.value)} class="text-[9px] px-1.5 py-1 rounded text-[#9a9491]" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);flex:1">
            <option value="">Dept…</option>
            ${DEPTS_FOR_SELECT.map(d => html`<option key=${d} value=${d}>${d}</option>`)}
          </select>
          <select value=${urgency} onChange=${e=>setUrgency(e.target.value)} class="text-[9px] px-1.5 py-1 rounded text-[#9a9491]" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1)">
            <option value="normal">Norm</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
          <label class="flex items-center gap-1 text-[9px] text-[#9a9491] cursor-pointer whitespace-nowrap">
            <input type="checkbox" checked=${followUp} onChange=${e=>setFollowUp(e.target.checked)} style="accent-color:#FF671F;width:10px;height:10px"/>
            FU
          </label>
        </div>
      </div>

      <!-- Input -->
      <div class="px-3 py-3 border-t flex-shrink-0" style="border-color:rgba(255,255,255,0.07)">
        <div class="flex gap-2">
          <textarea value=${input} rows="2" placeholder="Ask Rocky…"
            class="flex-1 resize-none px-2.5 py-2 text-xs rounded-xl"
            style=${{ background:'rgba(255,255,255,0.06)', border:`1px solid ${input?'rgba(255,103,31,0.4)':'rgba(255,255,255,0.1)'}` }}
            onChange=${e=>setInput(e.target.value)}
            onKeyDown=${e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }}
          />
          <button class="px-2.5 rounded-xl text-white flex-shrink-0 disabled:opacity-40"
            style="background:#FF671F"
            disabled=${loading||!input.trim()}
            onClick=${send}>→</button>
        </div>
      </div>
    </div>
  `;
}

          <span class=${syncing ? 'animate-spin inline-block' : 'inline-block'} style="font-size:15px">↻</span>
        </button>
        <div class="relative">
          <button class="btn btn-ghost btn-icon relative" onClick=${()=>setShowNotif(v=>!v)}>
            🔔
            <span class="absolute top-1 right-1 w-3.5 h-3.5 rounded-full text-white flex items-center justify-center text-[8px] font-bold" style="background:#FF671F">4</span>
          </button>
          ${showNotif && html`
            <>
              <div class="fixed inset-0 z-30" onClick=${()=>setShowNotif(false)}></div>
              <div class="absolute right-0 top-full mt-2 w-72 z-40 rounded-xl shadow-2xl overflow-hidden" style="background:#1e1a17;border:1px solid rgba(255,255,255,0.08)">
                <div class="flex items-center justify-between px-4 py-3 border-b" style="border-color:rgba(255,255,255,0.06)">
                  <span class="font-semibold text-sm">Live Alerts</span>
                  <button class="text-xs text-[#9a9491] hover:text-white" onClick=${()=>setShowNotif(false)}>Clear</button>
                </div>
                ${LIVE_ALERTS.slice(0,4).map(a => html`
                  <div key=${a.id} class=${'px-4 py-3 border-b hover:bg-[rgba(255,255,255,0.02)] transition-colors last:border-0 alert-' + a.severity} style="border-color:rgba(255,255,255,0.05)">
                    <div class="flex items-start justify-between gap-2">
                      <span class="text-sm font-medium text-white text-xs">${a.title}</span>
                      <span class=${'badge ' + a.badgeColor + ' text-[9px]'}>${a.badge}</span>
                    </div>
                    <div class="text-[10px] text-[#9a9491] mt-0.5">${a.time}</div>
                  </div>
                `)}
              </div>
            </>
          `}
        </div>
        <button class=${'btn btn-ghost btn-icon ' + (chatOpen ? 'text-[#FF671F]' : '')} style=${chatOpen ? 'background:rgba(255,103,31,0.12)' : ''} onClick=${onToggleChat} title="Toggle Chat">💬</button>
        <button class="btn btn-ghost btn-icon" onClick=${onToggleTv} title="Full-screen / TV mode">⤢</button>
      </div>
    </header>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════════════ */

const SECTION_COMPONENTS = {
  executive: ExecutiveCommand,
  departments: DepartmentIntelligence,
  interview: EmployeeInterview,
  painpoints: PainPointDiscovery,
  training: TrainingGaps,
  recommendations: RecommendationEngine,
  obsidian: ObsidianBrain,
  system: SystemStatus,
};

function App() {
  const [activeSection, setActiveSection] = useState('executive');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [chatOpen, setChatOpen] = useState(true);
  const [tvMode, setTvMode] = useState(false);
  const [showBrief, setShowBrief] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const mainRef = useRef(null);

  // IntersectionObserver for active section
  useEffect(() => {
    const observers = [];
    SECTIONS.forEach(({ id }) => {
      const el = document.getElementById(id);
      if (!el) return;
      const obs = new IntersectionObserver(([entry]) => {
        if (entry.isIntersecting) setActiveSection(id);
      }, { rootMargin: '-25% 0px -65% 0px', threshold: 0, root: mainRef.current });
      obs.observe(el);
      observers.push(obs);
    });
    return () => observers.forEach(o => o.disconnect());
  }, []);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setActiveSection(id);
  };

  const handleSync = () => {
    setSyncing(true);
    setTimeout(() => setSyncing(false), 1800);
  };

  if (tvMode) {
    return html`
      <div class="fixed inset-0 overflow-auto p-8" style="background:#0c0a09;z-index:9999">
        <button class="fixed top-4 right-4 z-50 px-3 py-1.5 rounded-lg text-white text-xs font-medium" style="background:rgba(255,255,255,0.1)" onClick=${()=>setTvMode(false)}>✕ Exit Full Screen</button>
        ${html`<${ExecutiveCommand} />`}
      </div>
    `;
  }

  return html`
    <div class="flex h-screen overflow-hidden" style="background:#0c0a09">
      <!-- Sidebar -->
      ${html`<${Sidebar} activeSection=${activeSection} collapsed=${sidebarCollapsed} onCollapse=${()=>setSidebarCollapsed(v=>!v)} onNavigate=${scrollTo} />`}

      <!-- Main -->
      <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
        ${html`<${CommandBar}
          activeSection=${activeSection}
          onToggleTv=${()=>setTvMode(true)}
          onToggleChat=${()=>setChatOpen(v=>!v)}
          chatOpen=${chatOpen}
          syncing=${syncing}
          onSync=${handleSync}
          onBrief=${()=>setShowBrief(true)}
        />`}
        <main ref=${mainRef} class="flex-1 overflow-y-auto" style="scroll-behavior:smooth">
          <div class="px-6 py-8 max-w-6xl mx-auto space-y-20">
            ${SECTIONS.map(s => {
              const SectionComp = SECTION_COMPONENTS[s.id];
              return html`<div key=${s.id} id=${s.id} class="scroll-mt-16">${html`<${SectionComp} />`}</div>`;
            })}
            <div class="h-16"></div>
          </div>
        </main>
      </div>

      <!-- Chat Dock -->
      ${chatOpen && html`<${ChatDock} onClose=${()=>setChatOpen(false)} />`}

      <!-- Modals -->
      ${showBrief && html`<${MorningBriefModal} onClose=${()=>setShowBrief(false)} />`}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   MOUNT
═══════════════════════════════════════════════════════════════════ */

const root = createRoot(document.getElementById('root'));
root.render(html`<${App} />`);
</script>
</body>
</html>
